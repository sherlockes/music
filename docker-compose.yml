name: sherlocaster

include:
  - ../sherlocaster/vpn.yaml

services:
  music:
    build: .
    image: music:latest
    container_name: music_app
    network_mode: "service:vpn_tunnel"
    depends_on:
      - vpn_tunnel
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - .:/app
      - ./rclone:/root/.config/rclone
      - ./data/cloud_music:/mnt/cloud_music:rshared
    environment:
      - TZ=Europe/Madrid
      - MUSIC_DIR=/mnt/cloud_music
      - RCLONE_CONFIG=/root/.config/rclone/rclone.conf
      - RCLONE_REMOTE=${RCLONE_REMOTE:-Sherlockes78_GD:}
      - RCLONE_AUTO_MOUNT=${RCLONE_AUTO_MOUNT:-true}
    restart: unless-stopped
